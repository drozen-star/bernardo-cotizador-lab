# =============================================================================
# Render Blueprint — Laboratorio Bernardo Cotizador (L4)
# =============================================================================
# Solo el web service del backend. Sin base de Render (la base es Supabase), sin
# frontends y sin migraciones ni seeds en el start command: la migración se aplica
# a mano antes del deploy (docs/CHECKLIST-DEPLOY-L4.md).
#
# Plan starter (USD 7): sin spin-down, 512 MB.
#
# Dos grupos de variables:
#   * sync: false  -> se cargan a mano en el dashboard: secretos y URLs que se
#                     conocen recién después del deploy.
#   * value: ...   -> fijas acá, con su valor escrito.
# Lo que la base no necesita en L4 (mail real, S3, captcha, FX) no figura.
# =============================================================================

services:
  - type: web
    name: bernardo-cotizador-lab-api
    runtime: python

    # agents/ y comparison/ son hermanos de backend/; app/__init__.py los resuelve
    # desde la raíz del repo, así que rootDir solo cambia el directorio de trabajo.
    rootDir: backend

    plan: starter
    # Supabase del lab está en sa-east-1; virginia es la región de Render más cercana.
    region: virginia
    branch: main

    # requirements.txt se genera desde uv.lock (CI verifica que no haya drift).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Sin alembic ni seed acá: solo la app. $PORT lo inyecta Render.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # /health siempre responde 200; los problemas de dependencias van en el cuerpo.
    healthCheckPath: /health

    autoDeploy: false

    envVars:
      # =========================================================================
      # A CARGAR A MANO (sync: false)
      # =========================================================================
      # ---- secretos -----------------------------------------------------------
      # Session pooler de Supabase (aws-0-sa-east-1, puerto 5432), driver psycopg 3.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      # Fuerte y distinto de cualquier otro servicio: la API de la base queda pública.
      - key: SECRET_KEY
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Key para la capa OpenAI-compat de Anthropic que usan las funciones de la base.
      # Vacía = fallbacks determinísticos (sin LLM) en esas funciones.
      - key: LLM_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: LAB_SHARED_SECRET
        sync: false
      - key: LAB_ADMIN_TOKEN
        sync: false

      # ---- URLs que se conocen después del deploy ----------------------------
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_FORM_URL
        sync: false
      # Orígenes exactos separados por coma. Vacío rompe CORS; "*" funciona con warning.
      - key: ALLOWED_ORIGINS
        sync: false

      # =========================================================================
      # FIJAS EN EL YAML
      # =========================================================================
      # ---- runtime ------------------------------------------------------------
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

      # ---- base de datos (pool tuneado para pooler) ---------------------------
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"

      # ---- agente de WhatsApp (L3) -------------------------------------------
      - key: BERNARDO_MODEL
        value: claude-sonnet-5
      - key: WHATSAPP_MAX_TOKENS
        value: "4096"
      - key: WHATSAPP_MAX_TOOL_ROUNDS
        value: "5"

      # ---- envío por Cloud API (L4) ------------------------------------------
      # Misma versión que el bot de producción (bot/wa/cloudapi.js).
      - key: GRAPH_API_VERSION
        value: v23.0
      - key: WHATSAPP_SEND_TIMEOUT_SECONDS
        value: "10"
      - key: WHATSAPP_WINDOW_HOURS
        value: "24"

      # ---- funciones LLM de la base (spec sección 7: capa OpenAI-compat) --------
      - key: LLM_BASE_URL
        value: https://api.anthropic.com/v1/
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: LLM_ENABLED
        value: "true"

      # ---- mail y archivos: en L4 no sale mail real ni hay adjuntos ------------
      - key: EMAIL_PROVIDER
        value: console
      - key: STORAGE_BACKEND
        value: local

      # ---- scheduler de la base ----------------------------------------------
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "15"
      - key: AUTO_SEND_FOLLOWUPS
        value: "false"

      # ---- compras / moneda --------------------------------------------------
      - key: DEFAULT_PROCUREMENT_TYPE
        value: goods
      - key: BASE_CURRENCY
        value: ARS
      - key: DEFAULT_GST_RATE
        value: "0"
      - key: DEMO_MODE_ENABLED
        value: "false"
