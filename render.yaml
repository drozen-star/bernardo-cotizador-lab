# =============================================================================
# Render Blueprint — Laboratorio Bernardo Cotizador (L4)
# =============================================================================
# Solo el web service del backend. Sin base de Render (la base es Supabase), sin
# frontends (no hacen falta para el lab de WhatsApp) y sin migraciones ni seeds en
# el start command: la migración se aplica a mano antes del deploy
# (docs/CHECKLIST-DEPLOY-L4.md).
#
# Plan starter (USD 7): sin spin-down, 512 MB. Todas las variables se cargan en el
# dashboard (sync: false): ninguna vive en el repo.
# =============================================================================

services:
  - type: web
    name: bernardo-cotizador-lab-api
    runtime: python

    # agents/ y comparison/ son hermanos de backend/; app/__init__.py los resuelve
    # desde la raíz del repo, así que rootDir solo cambia el directorio de trabajo.
    rootDir: backend

    plan: starter
    # Supabase del lab está en sa-east-1; virginia es la región de Render más cercana.
    region: virginia
    branch: main

    # requirements.txt se genera desde uv.lock (CI verifica que no haya drift).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Sin alembic ni seed acá: solo la app. $PORT lo inyecta Render.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # /health siempre responde 200; los problemas de dependencias van en el cuerpo.
    healthCheckPath: /health

    autoDeploy: false

    envVars:
      # ---------------------------------------------------------------- runtime
      - key: ENV
        sync: false

      # --------------------------------------------------------------- database
      # Session pooler de Supabase (aws-0-sa-east-1, puerto 5432), driver psycopg 3.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DB_POOL_SIZE
        sync: false
      - key: DB_MAX_OVERFLOW
        sync: false
      - key: DB_POOL_RECYCLE_SECONDS
        sync: false

      # ------------------------------------------------------------------- auth
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        sync: false

      # ------------------------------------------------------------------- URLs
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_FORM_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # ------------------------------------------------- agente de WhatsApp (L3)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BERNARDO_MODEL
        sync: false
      - key: BERNARDO_WA_NUMBER
        sync: false

      # ------------------------------------------------- bot -> lab y envío (L4)
      - key: LAB_SHARED_SECRET
        sync: false
      - key: LAB_ADMIN_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WA_GRAPH_VERSION
        sync: false

      # ------------------------------------------------- funciones LLM de la base
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_ENABLED
        sync: false

      # ------------------------------------------------------------------ email
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # ---------------------------------------------------------------- storage
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

      # ------------------------------------------------------------- scheduler
      - key: SCHEDULER_ENABLED
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
      - key: AUTO_SEND_FOLLOWUPS
        sync: false

      # ----------------------------------------------------- compras / moneda
      - key: DEFAULT_PROCUREMENT_TYPE
        sync: false
      - key: BASE_CURRENCY
        sync: false
      - key: DEFAULT_GST_RATE
        sync: false
      - key: DEMO_MODE_ENABLED
        sync: false
